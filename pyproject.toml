[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ephemeral-ring"
version = "0.1.0"
description = "Lock-Free SPSC Circular Memory-Mapped Ring Buffer Queue"
readme = "README.md"
authors = [{ name = "Subrat Sahu", email = "subratsahu195@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]
